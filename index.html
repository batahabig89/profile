<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Bump ASSET_VER everywhere below (and in script.js fetch) when CSS/JS/JSON change — avoids stale GitHub CDN + browser cache -->
    <script>
    (function () {
        if (location.protocol === 'file:') return;
        var p = location.pathname.replace(/\/index\.html?$/i, '');
        if (p !== '/' && p.slice(-1) !== '/') p += '/';
        document.write('<base href="' + encodeURI(p) + '">');
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
    <title id="pageTitle">Loading...</title>
    <link rel="stylesheet" href="styles.css?v=134">
</head>
<body>
    <div class="container">
        <div class="left-panel" id="leftPanel">
            <div class="loading">Loading profile...</div>
        </div>

        <div class="right-panel" id="rightPanel">
            <div class="loading">Loading profile...</div>
        </div>

        <!-- C++ playground (Code Editor template only) -->
        <aside class="cpp-panel" id="cppPanel" aria-label="C++ playground"></aside>
    </div>
    
    <footer class="page-footer">
        <div class="page-title">
            <h1 id="profileName">Loading...</h1>
            <p class="page-subtitle" id="profileTitle">Loading...</p>
        </div>
    </footer>

    <!-- Alternate templates (e.g. Halloween) render here -->
    <div id="templateRoot"></div>

    <div class="template-switcher" id="templateSwitcher">
        <!-- Phones show only this hamburger; it unfolds the panel below -->
        <button class="template-menu-btn" id="templateMenuBtn" type="button" aria-label="Choose template" aria-expanded="false" aria-controls="templatePanel">
            <span></span><span></span><span></span>
        </button>
        <div class="template-panel" id="templatePanel">
            <label for="templateSelect">Template</label>
            <select id="templateSelect"></select>
        </div>
    </div>

    <!-- Robot companion (tap = eye lasers, drag = move) -->
    <div class="robot-container" id="robotContainer" title="Tap me · drag me">
        <div class="robot">
            <div class="robot-head">
                <div class="robot-face">
                    <div class="robot-eyes">
                        <div class="robot-eye left-eye"><div class="robot-pupil"></div></div>
                        <div class="robot-eye right-eye"><div class="robot-pupil"></div></div>
                    </div>
                </div>
            </div>
            <div class="robot-body"><div class="robot-core"></div></div>
            <div class="robot-arm left-arm"><div class="robot-fin"></div></div>
            <div class="robot-arm right-arm"><div class="robot-fin"></div></div>
            <div class="robot-thrust"></div>
            <div class="robot-shadow"></div>
        </div>
    </div>

    <script src="cpp-editor.js?v=134"></script>
    <script src="flow-diagram.js?v=134"></script>
    <script src="robot-laser.js?v=134"></script>
    <script src="script.js?v=134"></script>
</body>
</html>
